<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英语单词展示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(76, 175, 80, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 195, 74, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(205, 220, 57, 0.2) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        .nature-elements {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .plant {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            animation: sway 3s ease-in-out infinite;
        }

        .plant:nth-child(1) { bottom: 0; left: 5%; animation-delay: 0s; }
        .plant:nth-child(2) { bottom: 0; left: 15%; font-size: 35px; animation-delay: 0.5s; }
        .plant:nth-child(3) { bottom: 0; right: 10%; font-size: 45px; animation-delay: 1s; }
        .plant:nth-child(4) { bottom: 0; right: 25%; font-size: 30px; animation-delay: 1.5s; }
        .plant:nth-child(5) { bottom: 0; left: 40%; font-size: 38px; animation-delay: 0.8s; }
        .plant:nth-child(6) { bottom: 0; right: 45%; font-size: 42px; animation-delay: 1.2s; }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        .ant {
            position: absolute;
            font-size: 20px;
            animation: crawl 15s linear infinite;
        }

        .ant:nth-child(1) { 
            bottom: 8%; 
            animation-duration: 20s;
            animation-delay: 0s;
        }
        .ant:nth-child(2) { 
            bottom: 12%; 
            animation-duration: 25s;
            animation-delay: 5s;
        }
        .ant:nth-child(3) { 
            bottom: 5%; 
            animation-duration: 18s;
            animation-delay: 8s;
        }
        .ant:nth-child(4) { 
            bottom: 10%; 
            animation-duration: 22s;
            animation-delay: 3s;
        }

        @keyframes crawl {
            0% { 
                left: -50px; 
                transform: scaleX(-1);
            }
            49% { 
                transform: scaleX(-1);
            }
            50% { 
                left: calc(100% + 50px); 
                transform: scaleX(1);
            }
            100% { 
                left: -50px; 
                transform: scaleX(1);
            }
        }

        .butterfly {
            position: absolute;
            font-size: 25px;
            animation: flutter 12s ease-in-out infinite;
            opacity: 0.5;
        }

        .butterfly:nth-child(1) {
            bottom: 15%;
            left: 10%;
            animation-duration: 15s;
            animation-delay: 2s;
        }

        .butterfly:nth-child(2) {
            bottom: 18%;
            right: 10%;
            animation-duration: 18s;
            animation-delay: 5s;
        }

        @keyframes flutter {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(60px, -30px) rotate(5deg); }
            50% { transform: translate(-50px, -25px) rotate(-5deg); }
            75% { transform: translate(70px, -20px) rotate(3deg); }
        }

        .flower {
            position: absolute;
            font-size: 30px;
            opacity: 0.5;
            animation: bloom 4s ease-in-out infinite;
        }

        .flower:nth-child(1) { bottom: 50px; left: 25%; animation-delay: 0s; }
        .flower:nth-child(2) { bottom: 45px; right: 35%; animation-delay: 1s; }
        .flower:nth-child(3) { bottom: 55px; left: 60%; animation-delay: 2s; }

        @keyframes bloom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .input-screen {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .input-screen h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .history-section {
            margin-bottom: 25px;
        }

        .history-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            text-align: left;
        }

        .history-checkboxes {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px;
            background: #f9f9f9;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 6px;
        }

        .checkbox-item:hover {
            background: #f0f0f0;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            flex: 1;
            font-size: 16px;
            cursor: pointer;
            color: #333;
        }

        .selected-count {
            color: #667eea;
            font-size: 13px;
            margin-top: 5px;
            text-align: right;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .display-screen {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: relative;
        }

        .display-screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .word-display {
            font-size: min(25vw, 25vh);
            font-weight: bold;
            color: white;
            text-align: center;
            line-height: 1.2;
            max-width: 90vw;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: visible;
            cursor: pointer;
        }

        .word-display:hover {
            text-shadow: 0 4px 30px rgba(255, 255, 255, 0.5);
        }

        .word-display.vertical {
            transform: rotate(90deg);
            max-width: 85vh;
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            padding: 15px 20px;
            font-size: 28px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-weight: bold;
            z-index: 10;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .back-button:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .rotate-button {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            padding: 15px 20px;
            font-size: 28px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-weight: bold;
            z-index: 10;
            line-height: 1;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rotate-button:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .switch-button {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            padding: 15px 20px;
            font-size: 28px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-weight: bold;
            z-index: 10;
            line-height: 1;
            width: 60px;
            height: 60px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .switch-button.active {
            display: flex;
        }

        .switch-button:active {
            background: rgba(255, 255, 255, 0.5);
        }

        .word-indicator {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 10;
            display: none;
        }

        .word-indicator.active {
            display: block;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-word {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            color: #333;
        }

        .phonetic-section {
            margin-bottom: 20px;
        }

        .phonetic {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .audio-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s;
        }

        .audio-button:hover {
            transform: scale(1.05);
        }

        .meaning-section {
            margin-bottom: 25px;
        }

        .part-of-speech {
            font-size: 18px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .definition-item {
            margin-bottom: 15px;
            padding-left: 20px;
            border-left: 3px solid #667eea;
        }

        .definition {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .example {
            font-size: 14px;
            color: #666;
            font-style: italic;
            margin-top: 5px;
        }

        .synonyms, .antonyms {
            margin-top: 10px;
            font-size: 14px;
        }

        .synonyms span, .antonyms span {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            margin: 3px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                max-height: 70vh;
            }

            .modal-word {
                font-size: 24px;
            }

            .part-of-speech {
                font-size: 16px;
            }

            .definition {
                font-size: 14px;
            }
        }

        /* 竖屏模式 */
        @media (orientation: portrait) {
            .word-display {
                font-size: min(28vw, 30vh);
                max-width: 85vw;
            }

            .word-display.vertical {
                font-size: min(28vw, 30vh);
                max-width: 85vh;
            }
            
            .input-screen h1 {
                font-size: 24px;
            }

            input[type="text"], button {
                font-size: 18px;
            }
        }

        /* 横屏模式 */
        @media (orientation: landscape) {
            .word-display {
                font-size: min(18vw, 35vh);
                max-width: 80vw;
            }

            .word-display.vertical {
                font-size: min(18vw, 35vh);
                max-width: 80vh;
            }

            .display-screen {
                padding: 15px;
            }

            .back-button {
                top: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .rotate-button {
                top: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .switch-button {
                top: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .word-indicator {
                top: 90px;
                font-size: 12px;
            }
        }

        /* 小屏横屏 */
        @media (orientation: landscape) and (max-height: 500px) {
            .word-display {
                font-size: min(15vw, 40vh);
            }

            .word-display.vertical {
                font-size: min(15vw, 40vh);
                max-width: 75vh;
            }

            .back-button {
                top: 15px;
                left: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .rotate-button {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .switch-button {
                top: 15px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .word-indicator {
                top: 75px;
                font-size: 11px;
            }

            .display-screen {
                padding: 10px;
            }
        }

        /* 新增动画样式 */
        @keyframes cowRun {
            0% {
                left: -220px;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            20% {
                transform: translateY(-15px) rotate(3deg) scale(1.05);
            }
            40% {
                transform: translateY(10px) rotate(-2deg) scale(1.1);
            }
            60% {
                transform: translateY(-12px) rotate(4deg) scale(1.08);
            }
            80% {
                transform: translateY(8px) rotate(-3deg) scale(1.05);
            }
            100% {
                left: calc(100vw + 220px);
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }

        .cow-run {
            animation: cowRun 4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        #cowImg {
            display: none;
            position: absolute;
            bottom: 25%;
            width: 200px;
            height: auto;
            z-index: 5;
        }

        #wasteImg {
            display: none;
            position: absolute;
            width: 160px;
            height: auto;
            z-index: 5;
        }

        @keyframes wasteFly {
            0% { 
                transform: scale(0.2) translate(-50%, -50%); 
                top: 10%; 
                left: 50%; 
                opacity: 0; 
            }
            80% { 
                transform: scale(1.8) translate(-50%, -50%);  
                opacity: 1; 
            }
            100% { 
                transform: scale(1.5) translate(-50%, -50%);  
                top: 50%; 
                left: 50%; 
            }
        }

        .waste-fly {
            animation: wasteFly 2.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <!-- 自然元素背景 -->
    <div class="nature-elements">
        <div class="plant">🌿</div>
        <div class="plant">🌱</div>
        <div class="plant">🌿</div>
        <div class="plant">🌾</div>
        <div class="plant">🌿</div>
        <div class="plant">🌱</div>
        
        <div class="ant">🐜</div>
        <div class="ant">🐜</div>
        <div class="ant">🐜</div>
        <div class="ant">🐜</div>
        
        <div class="butterfly">🦋</div>
        <div class="butterfly">🦋</div>
        
        <div class="flower">🌸</div>
        <div class="flower">🌺</div>
        <div class="flower">🌼</div>
    </div>

    <div class="container">
        <div class="input-screen" id="inputScreen">
            <h1>📚 NovaSchool出品</h1>
            
            <div class="history-section" id="historySection" style="display: none;">
                <div class="history-label">最近使用的单词（可多选）</div>
                <div class="history-checkboxes" id="historyCheckboxes">
                    <!-- 动态生成复选框 -->
                </div>
                <div class="selected-count" id="selectedCount">已选择 0 个单词</div>
                <div class="divider">或</div>
            </div>
            
            <div class="input-group">
                <input type="text" id="wordInput" placeholder="请输入英语中文如 apple苹果（多个用逗号分隔）..." autocomplete="off">
            </div>
            <button onclick="showWord()">展示单词</button>
        </div>

        <div class="display-screen" id="displayScreen">
            <button class="back-button" onclick="goBack()" title="返回">←</button>
            <button class="switch-button" id="switchButton" onclick="switchWord()" title="切换单词">⇄</button>
            <button class="rotate-button" onclick="toggleOrientation()" title="切换方向">⤸</button>
            <div class="word-indicator" id="wordIndicator">1/1</div>
            <div class="word-display" id="wordDisplay" onclick="showWordDetail()"></div>
            <img id="cowImg" src="cow.png" alt="牦牛">
            <img id="wasteImg" src="waste.png" alt="牛粪">
        </div>

        <!-- 单词详情弹窗 -->
        <div class="modal" id="modal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <div class="modal-word" id="modalWord"></div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 清洗文本（去标点、空格、全半角统一，用于宽松匹配）
        function normalizeText(str) {
            if (!str) return '';
            return str
                .replace(/[\s，。！？、；：“”‘’（）【】《》]/g, '')
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                .toLowerCase()
                .trim();
        }

        // 检查匹配（使用 Vercel 代理接口，无密钥）
async function checkMatch(english, userChinese) {
    if (!userChinese.trim()) return false;

    try {
        const response = await fetch(`/api/translate?text=${encodeURIComponent(english)}`);
        if (!response.ok) {
            console.error('Proxy status:', response.status);
            throw new Error('Proxy failed');
        }
        
        const data = await response.json();
        if (data.error) {
            console.error('Proxy error:', data.error);
            return false;
        }

        // 修改这里：用 data.translation
        const translated = data.translation || '';

        const normTrans = normalizeText(translated);
        const normUser  = normalizeText(userChinese);

        return normTrans === normUser || 
               (normTrans.length > 1 && (normUser.includes(normTrans) || normTrans.includes(normUser)));
    } catch (e) {
        console.error('翻译代理失败:', e);
        return false;
    }
}

        const wordInput = document.getElementById('wordInput');
        const inputScreen = document.getElementById('inputScreen');
        const displayScreen = document.getElementById('displayScreen');
        const wordDisplay = document.getElementById('wordDisplay');
        const historySection = document.getElementById('historySection');
        const historyCheckboxes = document.getElementById('historyCheckboxes');
        const selectedCount = document.getElementById('selectedCount');
        const switchButton = document.getElementById('switchButton');
        const wordIndicator = document.getElementById('wordIndicator');
        const modal = document.getElementById('modal');
        const modalWord = document.getElementById('modalWord');
        const modalBody = document.getElementById('modalBody');
        
        const MAX_HISTORY = 20;
        let wordHistory = [];
        let currentWords = [];
        let currentWordIndex = 0;

        // 页面加载时读取历史记录
        function loadHistory() {
            const stored = localStorage.getItem('wordHistory');
            if (stored) {
                wordHistory = JSON.parse(stored);
                updateHistoryCheckboxes();
            }
        }

        // 更新复选框列表
        function updateHistoryCheckboxes() {
            historyCheckboxes.innerHTML = '';
            
            if (wordHistory.length > 0) {
                historySection.style.display = 'block';
                wordHistory.forEach((word, index) => {
                    const div = document.createElement('div');
                    div.className = 'checkbox-item';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `word-${index}`;
                    checkbox.value = word;
                    checkbox.onchange = updateSelectedCount;
                    
                    const label = document.createElement('label');
                    label.htmlFor = `word-${index}`;
                    label.textContent = word;
                    
                    div.appendChild(checkbox);
                    div.appendChild(label);
                    historyCheckboxes.appendChild(div);
                });
            } else {
                historySection.style.display = 'none';
            }
            updateSelectedCount();
        }

        // 更新选中数量
        function updateSelectedCount() {
            const checkboxes = historyCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
            const count = checkboxes.length;
            selectedCount.textContent = `已选择 ${count} 个单词`;
        }

        // 保存单词到历史记录
        function saveToHistory(word) {
            wordHistory = wordHistory.filter(w => w.toLowerCase() !== word.toLowerCase());
            wordHistory.unshift(word);
            
            if (wordHistory.length > MAX_HISTORY) {
                wordHistory = wordHistory.slice(0, MAX_HISTORY);
            }
            
            localStorage.setItem('wordHistory', JSON.stringify(wordHistory));
            updateHistoryCheckboxes();
        }

        // 获取选中的单词
        function getSelectedWords() {
            const checkboxes = historyCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // 解析输入对
    async function parsePair(str) {

        str = str.trim();

        // 1 如果是英文开头
        const englishMatch = str.match(/^[a-zA-Z]+/);

        if (englishMatch) {
            const english = englishMatch[0];
            const chinese = str.substring(english.length).trim();
            return { english, chinese };
        }

        // 2 如果是中文
        if (/^[\u4e00-\u9fa5]+$/.test(str)) {

            try {

                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(str)}&langpair=zh|en`;

                const res = await fetch(url);
                const data = await res.json();

                const english = data.responseData.translatedText
                    .split(" ")[0]
                    .toLowerCase();

                return {
                    english: english,
                    chinese: str
                };

            } catch (err) {

                console.error("翻译失败", err);

                return {
                    english: "",
                    chinese: str
                };
            }
        }

        // 3 其它情况
        return {
            english: str,
            chinese: ""
        };
    }



        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                showWord();
            }
        });

        async function showWord() {
            const selectedWords = getSelectedWords();
            
            const inputText = wordInput.value.trim();
            let inputPairs = [];
            
            if (inputText !== '') {
                // 将输入按逗号分割并清理两端空格
                const rawPairs = inputText.split(',')
                    .map(pair => pair.trim())
                    .filter(str => str !== '');
                
                // 使用 Promise.all 等待所有单词的异步解析（和可能的翻译）完成
                inputPairs = await Promise.all(rawPairs.map(str => parsePair(str)));
                inputPairs = inputPairs.filter(obj => obj.english !== '');
            }
            
            currentWords = [
                ...selectedWords.map(word => ({ english: word, chinese: '' })),
                ...inputPairs
            ];
            
            const seen = new Set();
            currentWords = currentWords.filter(obj => {
                const low = obj.english.toLowerCase();
                if (seen.has(low)) return false;
                seen.add(low);
                return true;
            });
            
            if (currentWords.length === 0) {
                alert('请输入单词或选择历史单词！');
                return;
            }

            inputPairs.forEach(obj => saveToHistory(obj.english));

            currentWordIndex = 0;
            
            await displayCurrentWord();
            
            if (currentWords.length > 1) {
                switchButton.classList.add('active');
                wordIndicator.classList.add('active');
            } else {
                switchButton.classList.remove('active');
                wordIndicator.classList.remove('active');
            }
            
            inputScreen.style.display = 'none';
            displayScreen.classList.add('active');
            wordDisplay.classList.remove('vertical');
        }

        async function displayCurrentWord() {
            const obj = currentWords[currentWordIndex];
            wordDisplay.textContent = obj.english;
            wordIndicator.textContent = `${currentWordIndex + 1}/${currentWords.length}`;

            const transDiv = document.getElementById('translationDisplay');
            if (transDiv) {
                transDiv.textContent = '';
            }

            await triggerAnimation();
        }

        function switchWord() {
            if (currentWords.length <= 1) return;
            
            currentWordIndex = (currentWordIndex + 1) % currentWords.length;
            displayCurrentWord();
        }

        function goBack() {
            displayScreen.classList.remove('active');
            inputScreen.style.display = 'block';
            wordInput.value = '';
            
            const checkboxes = historyCheckboxes.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            updateSelectedCount();
            
            wordInput.focus();
        }

        function toggleOrientation() {
            wordDisplay.classList.toggle('vertical');
        }

        // 触发动画
        async function triggerAnimation() {
            const obj = currentWords[currentWordIndex];
            if (obj.chinese) {
                const isMatch = await checkMatch(obj.english, obj.chinese);
                if (isMatch) {
                    showTranslation(obj.chinese);
                    animateCow();
                } else {
                    animateWaste();
                }
            }
        }

        // 显示翻译
        function showTranslation(chinese) {
            let transDiv = document.getElementById('translationDisplay');
            if (!transDiv) {
                transDiv = document.createElement('div');
                transDiv.id = 'translationDisplay';
                transDiv.style.position = 'absolute';
                transDiv.style.bottom = '20px';
                transDiv.style.left = '50%';
                transDiv.style.transform = 'translateX(-50%)';
                transDiv.style.color = 'white';
                transDiv.style.fontSize = '14px';
                transDiv.style.zIndex = '10';
                displayScreen.appendChild(transDiv);
            }
            transDiv.textContent = chinese;
        }

        // 动画牦牛
        function animateCow() {
            const cow = document.getElementById('cowImg');
            cow.style.display = 'block';
            cow.style.left = '-220px';
            cow.classList.add('cow-run');
            cow.addEventListener('animationend', () => {
                cow.style.display = 'none';
                cow.classList.remove('cow-run');
            }, { once: true });
        }

        // 动画牛粪
        function animateWaste() {
            const waste = document.getElementById('wasteImg');
            waste.style.display = 'block';
            waste.style.top = '10%';
            waste.style.left = '50%';
            waste.style.transform = 'scale(0.1) translate(-50%, -50%)';
            waste.classList.add('waste-fly');
            waste.addEventListener('animationend', () => {
                setTimeout(() => {
                    waste.style.display = 'none';
                    waste.classList.remove('waste-fly');
                }, 1000);
            }, { once: true });
        }

        // 显示单词详情
        async function showWordDetail() {
            const word = currentWords[currentWordIndex].english;
            modalWord.textContent = word;
            modalBody.innerHTML = '<div class="loading">加载中...</div>';
            modal.classList.add('active');
            
            try {
                let response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                
                if (!response.ok) {
                    response = await fetch(`https://corsproxy.io/?${encodeURIComponent(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`)}`);
                }
                
                if (!response.ok) {
                    throw new Error('单词未找到');
                }
                
                const data = await response.json();
                displayWordInfo(data);
            } catch (error) {
                console.error('API Error:', error);
                modalBody.innerHTML = `<div class="error-message">😕 抱歉，未找到"${word}"的详细信息<br><small>请检查网络连接</small></div>`;
            }
        }

        // 展示单词信息
        function displayWordInfo(data) {
            if (!data || data.length === 0) {
                modalBody.innerHTML = '<div class="error-message">未找到单词信息</div>';
                return;
            }

            const wordData = data[0];
            let html = '';

            if (wordData.phonetics && wordData.phonetics.length > 0) {
                html += '<div class="phonetic-section">';
                
                const phoneticWithText = wordData.phonetics.find(p => p.text);
                if (phoneticWithText) {
                    html += `<div class="phonetic">${phoneticWithText.text}</div>`;
                }
                
                const phoneticWithAudio = wordData.phonetics.find(p => p.audio);
                if (phoneticWithAudio && phoneticWithAudio.audio) {
                    html += `<button class="audio-button" onclick="playAudio('${phoneticWithAudio.audio}')">🔊 播放发音</button>`;
                }
                
                html += '</div>';
            }

            if (wordData.meanings && wordData.meanings.length > 0) {
                wordData.meanings.forEach(meaning => {
                    html += '<div class="meaning-section">';
                    html += `<div class="part-of-speech">${meaning.partOfSpeech}</div>`;
                    
                    if (meaning.definitions && meaning.definitions.length > 0) {
                        meaning.definitions.slice(0, 3).forEach((def, index) => {
                            html += '<div class="definition-item">';
                            html += `<div class="definition">${index + 1}. ${def.definition}</div>`;
                            
                            if (def.example) {
                                html += `<div class="example">"${def.example}"</div>`;
                            }
                            
                            html += '</div>';
                        });
                    }
                    
                    if (meaning.synonyms && meaning.synonyms.length > 0) {
                        html += '<div class="synonyms"><strong>同义词：</strong>';
                        meaning.synonyms.slice(0, 5).forEach(syn => {
                            html += `<span>${syn}</span>`;
                        });
                        html += '</div>';
                    }
                    
                    if (meaning.antonyms && meaning.antonyms.length > 0) {
                        html += '<div class="antonyms"><strong>反义词：</strong>';
                        meaning.antonyms.slice(0, 5).forEach(ant => {
                            html += `<span>${ant}</span>`;
                        });
                        html += '</div>';
                    }
                    
                    html += '</div>';
                });
            }

            modalBody.innerHTML = html;
        }

        // 播放音频
        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(err => {
                console.error('播放失败:', err);
                alert('音频播放失败');
            });
        }

        // 关闭弹窗
        function closeModal(event) {
            if (!event || event.target === modal) {
                modal.classList.remove('active');
            }
        }

        // 页面加载时初始化
        loadHistory();
    </script>
</body>
</html>
